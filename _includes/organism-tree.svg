<svg class="sketch" viewBox="0 0 640 320" role="img" aria-label="Tree of the five species. Human and zebrafish group together as vertebrates, fruit fly and nematode group together, these two groups join as animals, and budding yeast is the outgroup." style="width:100%;max-width:640px;display:block;margin:1.5rem auto;font-family:Gaegu,cursive">
