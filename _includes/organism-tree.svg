    <text x="416" y="174">Fruit fly <tspan font-size="16" font-style="italic">D. melanogaster</tspan></text>
    <text x="416" y="230">Nematode <tspan font-size="16" font-style="italic">C. elegans</tspan></text>
    <text x="416" y="296">Yeast <tspan font-size="16" font-style="italic">S. cerevisiae</tspan></text>
